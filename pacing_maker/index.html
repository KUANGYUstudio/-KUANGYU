<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光聿 KUANGYU - 賽事配速表產生器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --panel-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --primary: #2c2c2c;
            --primary-hover: #4a4a4a;
            --danger: #e05252;
            --danger-hover: #c94646;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部 Logo 區塊 */
        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .app-header img {
            height: 48px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .app-header h1 {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        /* 主佈局 */
        .app-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* 面板共用樣式 */
        .panel {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .controls {
            flex: 1;
            max-width: 800px;
        }
        .preview-area {
            width: max-content;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h3 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* 設定區塊 */
        .settings-group, .display-toggles {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .settings-group label, .display-toggles label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
        }

        input[type="number"], input[type="text"] {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--text-main);
            background-color: #fff;
        }
        input[type="number"] { width: 80px; }

        /* 站點資料表單 */
        .data-grid {
            width: 100%;
        }
        .header-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr 1fr 0.5fr 0.5fr;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: left;
        }
        .row-entry {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr 1fr 0.5fr 0.5fr;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        
        /* 按鈕設計 */
        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }
        button:hover { background-color: var(--primary-hover); }
        button.btn-danger {
            background-color: var(--danger);
            padding: 6px 10px;
        }
        button.btn-danger:hover { background-color: var(--danger-hover); }
        
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* 預覽區塊設定 - 維持精確輸出 */
        #render-container {
            background: #fff;
            border: 1px dashed #ccc;
            padding: 20px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
        }
        #pacing-table {
            border-collapse: collapse;
            border: 1px solid #000;
            box-sizing: border-box;
            background-color: #fff;
            color: #000;
        }
        #pacing-table .station-cell {
            border: 1px solid #000;
            padding: 2px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            gap: 2px;
        }
        #pacing-table .row:nth-child(even) .station-cell {
            background-color: #f2f2f2;
        }
        .cell-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .station-name { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 4px; }
        .val-int-km { font-size: 12px; color: #444; }
        .val-time { font-weight: bold; font-size: 14px; }
        .val-alt { font-size: 11px; color: #444; }
        .val-watt { font-size: 12px; font-weight: bold; color: #c94646; }
        .val-cutoff { font-size: 11px; color: #c94646; font-weight: bold; }
        .unit { font-size: 10px; font-weight: normal; margin-left: 1px; }

        /* Custom Checkbox */
        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <!-- 自動讀取上一層目錄的 KUANGYU_logo_icon.png -->
        <img src="../KUANGYU_logo_icon.png" alt="光聿 KUANGYU">
        <h1>賽事配速表產生器</h1>
    </div>

    <div class="app-container">
        <div class="panel controls">
            <h3>版面與顯示設定</h3>
            <div class="settings-group">
                <label>寬度 (cm) <input type="number" id="tb-width" value="4.5" step="0.1" onchange="generateTable()"></label>
                <label>高度 (cm) <input type="number" id="tb-height" value="14" step="0.5" onchange="generateTable()"></label>
            </div>
            <div class="display-toggles">
                <label><input type="checkbox" id="show-alt" onchange="generateTable()"> 顯示海拔</label>
                <label><input type="checkbox" id="show-watt" checked onchange="generateTable()"> 顯示瓦數</label>
                <label><input type="checkbox" id="show-cutoff" onchange="generateTable()"> 顯示關門時間</label>
            </div>

            <h3 style="margin-top: 10px;">站點資料</h3>
            <div class="data-grid">
                <div class="header-row">
                    <span>站點名稱</span>
                    <span>總里程</span>
                    <span>段里程</span>
                    <span>時間(分)</span>
                    <span>海拔(m)</span>
                    <span>瓦數(W)</span>
                    <span>關門時間</span>
                    <span style="text-align: center;">補給</span>
                    <span style="text-align: center;">刪除</span>
                </div>
                <div id="rows-container"></div>
            </div>
            
            <div class="action-buttons">
                <button onclick="addRow()">+ 新增站點</button>
                <button onclick="exportImage()" style="background-color: #2b78e4;">下載為圖片</button>
            </div>
        </div>

        <div class="panel preview-area">
            <h3>預覽</h3>
            <div id="render-container">
                <div id="pacing-table"></div>
            </div>
        </div>
    </div>

<script>
    let stations = [
        { name: "人止關", totalKm: "16.1", intKm: "16", time: "35", alt: "790", watt: "180", cutoff: "", supply: false },
        { name: "霧社", totalKm: "21.4", intKm: "5", time: "21", alt: "1148", watt: "185", cutoff: "", supply: true },
        { name: "見晴", totalKm: "28.4", intKm: "7", time: "35", alt: "1550", watt: "180", cutoff: "09:00", supply: false },
        { name: "清境小七", totalKm: "33.4", intKm: "5", time: "20", alt: "1748", watt: "175", cutoff: "", supply: false },
        { name: "翠峰", totalKm: "39.4", intKm: "6", time: "24", alt: "2309", watt: "170", cutoff: "11:00", supply: true },
        { name: "鳶峰", totalKm: "46.0", intKm: "6.6", time: "36", alt: "2750", watt: "160", cutoff: "12:30", supply: false },
        { name: "昆陽", totalKm: "51.2", intKm: "5", time: "26", alt: "3070", watt: "155", cutoff: "13:30", supply: false },
        { name: "武嶺", totalKm: "53.3", intKm: "2", time: "13", alt: "3275", watt: "160", cutoff: "14:00", supply: false }
    ];

    const svgWaterDrop = `<svg width="12" height="12" viewBox="0 0 24 24"><path fill="#2b78e4" d="M12,21c-3.3,0-6-2.7-6-6c0-4,6-11,6-11s6,7,6,11C18,18.3,15.3,21,12,21z"/></svg>`;

    function renderInputs() {
        const container = document.getElementById("rows-container");
        container.innerHTML = "";
        stations.forEach((st, idx) => {
            container.innerHTML += `
                <div class="row-entry">
                    <input type="text" value="${st.name}" onchange="updateData(${idx}, 'name', this.value)">
                    <input type="text" value="${st.totalKm}" onchange="updateData(${idx}, 'totalKm', this.value)">
                    <input type="text" value="${st.intKm}" onchange="updateData(${idx}, 'intKm', this.value)">
                    <input type="text" value="${st.time}" onchange="updateData(${idx}, 'time', this.value)">
                    <input type="text" value="${st.alt}" onchange="updateData(${idx}, 'alt', this.value)">
                    <input type="text" value="${st.watt}" onchange="updateData(${idx}, 'watt', this.value)">
                    <input type="text" value="${st.cutoff}" onchange="updateData(${idx}, 'cutoff', this.value)">
                    <div style="text-align: center;">
                        <input type="checkbox" ${st.supply ? 'checked' : ''} onchange="updateData(${idx}, 'supply', this.checked)">
                    </div>
                    <div style="text-align: center;">
                        <button class="btn-danger" onclick="removeRow(${idx})">✕</button>
                    </div>
                </div>
            `;
        });
    }

    function updateData(idx, field, value) {
        stations[idx][field] = value;
        generateTable();
    }

    function addRow() {
        stations.push({ name: "", totalKm: "", intKm: "", time: "", alt: "", watt: "", cutoff: "", supply: false });
        renderInputs();
        generateTable();
    }

    function removeRow(idx) {
        stations.splice(idx, 1);
        renderInputs();
        generateTable();
    }

    function generateTable() {
        const widthCm = document.getElementById("tb-width").value;
        const heightCm = document.getElementById("tb-height").value;
        const showAlt = document.getElementById("show-alt").checked;
        const showWatt = document.getElementById("show-watt").checked;
        const showCutoff = document.getElementById("show-cutoff").checked;
        
        const table = document.getElementById("pacing-table");
        const pxPerCm = 37.8 * 1.5; 
        table.style.width = (widthCm * pxPerCm) + "px";
        table.style.height = (heightCm * pxPerCm) + "px";
        
        table.innerHTML = "";
        const rowHeightPercent = 100 / stations.length;

        stations.forEach(st => {
            const supplyIcon = st.supply ? svgWaterDrop : "";
            const altHtml = (showAlt && st.alt) ? `<span class="val-alt">${st.alt}m</span>` : ``;
            const wattHtml = (showWatt && st.watt) ? `<span class="val-watt">${st.watt}<span class="unit">w</span></span>` : ``;
            const cutoffHtml = (showCutoff && st.cutoff) ? `<span class="val-cutoff">${st.cutoff}</span>` : ``;
            
            const rowHtml = `
                <div class="row" style="height: ${rowHeightPercent}%;">
                    <div class="station-cell" style="height: 100%;">
                        <div class="cell-row">
                            <span class="station-name">${st.name} ${supplyIcon}</span>
                            ${cutoffHtml}
                        </div>
                        <div class="cell-row" style="border-top: 1px dotted #ccc; padding-top: 2px;">
                            ${altHtml || `<span class="val-int-km">${st.intKm}<span class="unit">k</span></span>`}
                            ${wattHtml}
                            <span class="val-time">${st.time}<span class="unit">m</span></span>
                        </div>
                    </div>
                </div>
            `;
            table.innerHTML += rowHtml;
        });
    }

    function exportImage() {
        generateTable(); 
        const tableNode = document.getElementById("pacing-table");
        html2canvas(tableNode, { scale: 3 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'KUANGYU_pacing_table.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    renderInputs();
    generateTable();
</script>

</body>
</html>
