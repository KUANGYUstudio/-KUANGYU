
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2d">
<title>Triathlon Coach Lab｜鐵人三項數據教室</title>
<style>
:root {
  --bg:#f4f6f8;
  --ink:#172338;
  --muted:#697789;
  --navy:#101b2d;
  --lime:#c7f36b;
  --line:#e3e8ee;
  --card:#fff;
  --blue:#eaf1fb;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans TC",sans-serif;
}
header {
  background:var(--navy);
  color:white;
  padding:34px max(22px,calc((100% - 1120px)/2)) 28px;
  position:relative;
  overflow:hidden;
}
header:after {
  content:"";
  position:absolute;
  width:300px;height:300px;
  border:1px solid #ffffff18;
  border-radius:50%;
  right:8%;top:-190px;
  box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05;
}
.eyebrow {
  color:var(--lime);
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}
.brand {
  font-size:clamp(26px,4vw,38px);
  font-weight:850;
  letter-spacing:-1px;
  margin:10px 0 6px;
}
.sub {
  color:#b8c4d2;
  font-size:14px;
  max-width:650px;
  line-height:1.7;
}
.wrap {
  max-width:1120px;
  margin:0 auto;
  padding:26px 22px 60px;
}
.intro {
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end;
  margin-bottom:18px;
}
.intro h2 { font-size:19px;margin:0 0 5px; }
.intro p { margin:0;color:var(--muted);font-size:13px; }
.pill {
  font-size:11px;
  font-weight:750;
  background:#eaf5d8;
  color:#46631d;
  border-radius:30px;
  padding:8px 12px;
  white-space:nowrap;
}
.tabs {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0 20px;
}
.tab {
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  padding:14px 15px;
  text-align:left;
  cursor:pointer;
  transition:.18s;
  color:var(--ink);
  min-height:76px;
}
.tab:hover { transform:translateY(-2px);border-color:#9cb86c; }
.tab.active {
  background:var(--navy);
  color:white;
  border-color:var(--navy);
  box-shadow:0 7px 18px #101b2d20;
}
.tab b { display:block;font-size:17px;letter-spacing:.3px; }
.tab small {
  display:block;
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}
.tab.active small { color:#c2cbd7; }
.panel {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(18px,3vw,30px);
  box-shadow:0 8px 28px #14243b08;
}
.panel-head {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:20px;
}
.kicker {
  font-size:11px;
  letter-spacing:1.5px;
  color:#76913e;
  font-weight:850;
}
.panel h3 { font-size:26px;margin:5px 0; }
.english { font-size:12px;color:var(--muted); }
.tag {
  background:var(--blue);
  color:#38577d;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
}
.definition { font-size:15px;line-height:1.85;margin:0 0 20px; }
.formula {
  background:var(--navy);
  color:white;
  padding:15px 17px;
  border-radius:11px;
  font-size:15px;
  font-weight:750;
  margin:12px 0;
}
.formula small {
  display:block;
  color:#b8c4d2;
  font-size:11px;
  font-weight:450;
  margin-top:6px;
}
.grid {
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px;
}
.section {
  border:1px solid var(--line);
  border-radius:13px;
  padding:17px;
  min-width:0;
}
.section h4 { margin:0 0 12px;font-size:14px; }
.section p {
  font-size:13px;
  line-height:1.8;
  color:#4c5b6d;
  margin:0;
}
table { border-collapse:collapse;width:100%;font-size:12px; }
th {
  text-align:left;
  color:#687789;
  background:#f5f7f9;
  font-weight:750;
}
td,th {
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
tr:last-child td { border-bottom:0; }
.magnitude { margin-top:16px; }
.magnitude h4 { margin:0 0 12px;font-size:14px; }
.magnitude-caption {
  color:var(--muted);
  font-size:11px;
  line-height:1.75;
  margin:10px 0 0;
}
.source {
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.source h4 { font-size:13px;margin:0 0 9px; }
.source ul { margin:0;padding-left:18px; }
.source li {
  font-size:11px;
  line-height:1.8;
  color:var(--muted);
  margin:3px 0;
}
a { color:#315f91;text-decoration:none; }
a:hover { text-decoration:underline; }
.note {
  margin-top:17px;
  background:#fff8e8;
  border:1px solid #f2e4c4;
  padding:14px 16px;
  border-radius:11px;
  font-size:12px;
  line-height:1.8;
  color:#6d572b;
}
footer {
  text-align:center;
  color:#8a96a5;
  font-size:11px;
  margin-top:24px;
  line-height:1.8;
}
@media(max-width:720px) {
  .tabs { grid-template-columns:repeat(2,1fr); }
  .grid { grid-template-columns:1fr; }
  .intro { align-items:start;flex-direction:column; }
  .panel-head { flex-direction:column; }
  .tab { min-height:68px; }
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">KUANGYU STUDIO / COACH EDUCATION</div>
  <div class="brand">TRIATHLON COACH LAB</div>
  <div class="sub">
    鐵人三項訓練數據教室｜把數字看懂，再把數據變成訓練決策。
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div>
      <h2>訓練數據快速查詢</h2>
      <p>選擇下方指標，查看定義、官方參考、量級示意、教練判讀與資料來源。</p>
    </div>
    <span class="pill">COACH TOOLKIT · 01</span>
  </div>

  <nav class="tabs" id="tabs" aria-label="數據指標">
    <button class="tab active" data-key="tss">
      <b>TSS</b><small>單次訓練負荷</small>
    </button>
    <button class="tab" data-key="if">
      <b>IF</b><small>強度係數</small>
    </button>
    <button class="tab" data-key="ctl">
      <b>CTL</b><small>長期訓練負荷</small>
    </button>
    <button class="tab" data-key="atl">
      <b>ATL</b><small>短期訓練負荷</small>
    </button>
    <button class="tab" data-key="tsb">
      <b>TSB</b><small>訓練壓力平衡</small>
    </button>
    <button class="tab" data-key="lt">
      <b>LT</b><small>乳酸閾值</small>
    </button>
    <button class="tab" data-key="zones">
      <b>TRAINING ZONES</b><small>訓練強度區間</small>
    </button>
    <button class="tab" data-key="css">
      <b>CSS</b><small>游泳臨界配速</small>
    </button>
    <button class="tab" data-key="atp">
      <b>ATP</b><small>年度訓練量參考</small>
    </button>
  </nav>

  <section class="panel" id="panel" aria-live="polite"></section>

  <footer>
    本工具為教學與訓練討論參考，不是醫療診斷、醫療安全門檻或個人化處方。
    數值需依運動項目、測試方法、閾值設定、訓練背景與個人反應解讀。<br>
    KUANGYU STUDIO · TRIATHLON COACH LAB
  </footer>
</main>

function makeTable(headers, rows) {
  return `
    <table>
      <thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(row=>`<tr>${row.map(value=>`<td>${value}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

function render(key) {
  const d = data[key];

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active",button.dataset.key===key);
  });

  const extraTable = d.extraTitle ? `
    <div class="section magnitude">
      <h4>${d.extraTitle}</h4>
      ${makeTable(d.extraHeads,d.extraRows)}
      ${d.extraCaption ? `<p class="magnitude-caption">${d.extraCaption}</p>` : ""}
    </div>
  ` : "";

  const sourceList = (d.sources || []).map(source =>
    `<li><a href="${source[1]}" target="_blank" rel="noopener noreferrer">${source[0]}</a></li>`
  ).join("");

  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div>
        <div class="kicker">DATA GUIDE / ${key.toUpperCase()}</div>
        <h3>${d.title}</h3>
        <div class="english">${d.en}</div>
      </div>
      <span class="tag">${d.tag}</span>
    </div>

    <p class="definition">${d.desc}</p>

    ${d.formula ? `
      <div class="formula">
        ${d.formula}
        <small>${d.fsub || ""}</small>
      </div>
    ` : ""}

    <div class="grid">
      <div class="section">
        <h4>參考表｜官方或科學依據</h4>
        ${makeTable(d.heads,d.rows)}
      </div>

      <div class="section">
        <h4>實際例子</h4>
        <p>${d.example}</p>
        <div style="height:14px"></div>
        <h4>教練判讀</h4>
        <p>${d.coach}</p>
      </div>
    </div>

    ${extraTable}

    <div class="note">
      <b>重要提醒</b><br>
      ${d.note}
    </div>

    <div class="source">
      <h4>資料來源</h4>
      <ul>${sourceList}</ul>
    </div>
  `;
}

document.getElementById("tabs").addEventListener("click",event=>{
  const button=event.target.closest("button[data-key]");
  if(button) render(button.dataset.key);
});

render("tss");
</script>
