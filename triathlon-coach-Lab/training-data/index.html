table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:#687789;background:#f5f7f9;font-weight:750}

.magnitude{margin-top:16px}

.source h4{font-size:13px;margin:0 0 9px}.source ul{margin:0;padding-left:18px}.source li{font-size:11px;line-height:1.8;color:var(--muted);margin:3px 0}

<header>
  <div class="eyebrow">KUANGYU STUDIO / COACH EDUCATION</div>

  <div class="intro">

    <span class="pill">COACH TOOLKIT · 01</span>
  </div>
  <nav class="tabs" id="tabs" aria-label="數據指標">
    <button class="tab active" data-key="tss"><b>TSS</b><small>單次訓練負荷</small></button>
    <button class="tab" data-key="if"><b>IF</b><small>強度係數</small></button>
    <button class="tab" data-key="ctl"><b>CTL</b><small>長期訓練負荷</small></button>
    <button class="tab" data-key="atl"><b>ATL</b><small>短期訓練負荷</small></button>
    <button class="tab" data-key="tsb"><b>TSB</b><small>訓練壓力平衡</small></button>
    <button class="tab" data-key="lt"><b>LT</b><small>乳酸閾值</small></button>
    <button class="tab" data-key="zones"><b>TRAINING ZONES</b><small>訓練強度區間</small></button>
    <button class="tab" data-key="css"><b>CSS</b><small>游泳臨界游速</small></button>
  </nav>
  <section class="panel" id="panel" aria-live="polite"></section>
  <footer>本工具為教學與教練討論參考，不是醫療診斷、醫療安全門檻或個人化處方。<br>數值需依項目、測試方法、閾值設定、訓練背景與個人反應解讀。<br>KUANGYU STUDIO · TRIATHLON COACH LAB</footer>
</main>

 extraRows:[["0","Rest（休息）"],["1","Very easy（非常輕鬆）"],["2","Easy（輕鬆）"],["3","Moderate（中等）"],["4","Somewhat hard（稍吃力）"],["5","Hard（吃力）"],["7","Very hard（非常吃力）"],["9","Very, very hard（非常、非常吃力）"],["10","Maximal effort（最大努力）"]],
 extraCaption:"ACSM 圖表未對 6、8 提供文字描述。談話測試：中等強度通常仍可持續交談；高強度通常只能說少量字句。",
 sources:[["ACSM：Tips for Monitoring Aerobic Exercise Intensity","https://acsm.org/wp-content/uploads/2025/02/Exercise-intensity-infographic-PDF.pdf"],["ACSM / ESSA 聯合強度術語共識聲明","https://doi.org/10.1249/MSS.0000000000003795"]]
},
css:{
 title:"CSS｜游泳臨界游速",en:"Critical Swim Speed",tag:"個人游泳配速估算",

 formula:"CSS 速度 =（較長距離時間 − 較短距離時間）÷ 距離差",fsub:"常見測試組合為 400m 與 200m；計算時使用秒與公尺，再換算為每 100m 配速。",
 heads:["相對 CSS 的配速","常見訓練用途"],
 rows:[["快於 CSS","較高強度，通常用於較短間歇；需依課程設計"],["接近 CSS","閾值附近的持續或間歇訓練參考"],["慢於 CSS","可用於較輕鬆的有氧、技術或恢復游；仍須看實際強度"]],
 example:"假設 400m 用時 8:00（480 秒）、200m 用時 3:50（230 秒）：CSS = (480−230) ÷ 200 = 1.25 秒／公尺，約 2:05／100m。",
 coach:"盡量固定泳池長度、出發方式、測試順序、休息時間與努力程度。CSS 可協助安排訓練配速，但不等於所有比賽距離的實際比賽配速。",
 note:"CSS 不是醫療或安全標準。測試表現會受游泳技術、轉身、泳池長度、疲勞及測試協定影響；請使用選手實測資料。",
 sources:[["TrainingPeaks Glossary","https://help.trainingpeaks.com/hc/en-us/articles/115001271712-Glossary"]]
}

function makeTable(headers, rows){
 return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function render(key){
 const d=data[key];
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.key===key));
 const formula=d.formula?`<div class="formula">${d.formula}<small>${d.fsub||""}</small></div>`:"";
 const extra=d.extraTitle?`<div class="section magnitude"><h4>${d.extraTitle}</h4>${makeTable(d.extraHeads,d.extraRows)}<p class="magnitude-caption">${d.extraCaption||"此表依來源內容整理，使用時請確認適用範圍。"}</p></div>`:"";
 const second=d.extraTitle&&d.extraRows?extra:"";
 const sources=(d.sources||[]).map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener noreferrer">${s[0]}</a></li>`).join("");
 document.getElementById("panel").innerHTML=`
  <div class="panel-head"><div><div class="kicker">DATA GUIDE / ${key.toUpperCase()}</div><h3>${d.title}</h3><div class="english">${d.en}</div></div><span class="tag">${d.tag}</span></div>
  <p class="definition">${d.desc}</p>
  ${formula}
  <div class="grid">
   <div class="section"><h4>參考表｜官方或科學依據</h4>${makeTable(d.heads,d.rows)}</div>
   <div class="section"><h4>實際例子</h4><p>${d.example}</p><div style="height:14px"></div><h4>教練判讀</h4><p>${d.coach}</p></div>
  </div>
  ${d.extraTitle?second:""}
  ${d.extraTitle&&d.extraCaption? "":""}
  ${d.extraTitle&&d.extraHeads? "":""}
  ${d.extraTitle&&d.extraRows? "":""}
  ${d.extraTitle&&d.extraCaption? "":""}
  ${d.extraTitle&&d.extraRows? "":""}
  ${d.extraTitle&&d.extraCaption? "":""}
  ${d.extraTitle&&d.extraRows? "":""}
  ${d.extraTitle&&d.extraCaption? "":""}
  ${d.extraTitle&&d.extraRows? "":""}
  ${d.extraTitle&&d.extraCaption? "":""}
  ${d.extraTitle&&d.extraRows? "":""}
  ${d.extraTitle&&d.extraCaption? "":""}
  ${d.extraTitle&&d.extraRows? "":""}
  <div class="note"><b>重要提醒</b><br>${d.note}</div>
  <div class="source"><h4>資料來源</h4><ul>${sources}</ul></div>
 `;
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-key]");if(b)render(b.dataset.key)});
render("tss");
</script>
