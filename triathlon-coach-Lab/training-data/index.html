<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24496b">
<title>Triathlon Coach Lab｜鐵人三項數據教室</title>
<style>
:root {
  --bg:#f4f6f8;
  --ink:#172338;
  --muted:#697789;
  --navy:#24496b;
  --lime:#c7f36b;
  --line:#e3e8ee;
  --card:#fff;
  --blue:#eaf1fb;
}
- { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans TC",sans-serif;
}
header {
  background:var(--navy);
  color:white;
  padding:34px max(22px,calc((100% - 1120px)/2)) 28px;
  position:relative;
  overflow:hidden;
}
header:after {
  content:"";
  position:absolute;
  width:300px;height:300px;
  border:1px solid #ffffff18;
  border-radius:50%;
  right:8%;top:-190px;
  box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05;
}
.eyebrow {
  color:var(--lime);
  font-size:13px;
  letter-spacing:2px;
  font-weight:800;
}
.brand {
  font-size:clamp(28px,4.5vw,42px);
  font-weight:850;
  letter-spacing:-1px;
  margin:10px 0 6px;
}
.sub {
  color:#d0dce8;
  font-size:16px;
  max-width:650px;
  line-height:1.7;
}
.wrap {
  max-width:1120px;
  margin:0 auto;
  padding:26px 22px 60px;
}
.intro {
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end;
  margin-bottom:18px;
}
.intro h2 { font-size:22px;margin:0 0 5px; }
.intro p { margin:0;color:var(--muted);font-size:15px; }
.pill {
  font-size:13px;
  font-weight:750;
  background:#eaf5d8;
  color:#46631d;
  border-radius:30px;
  padding:8px 12px;
  white-space:nowrap;
}
.category-tabs {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:18px 0 12px;
}
.subnav-wrap {
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  margin-bottom:20px;
}
.subnav-label {
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  margin:0 0 9px;
}
.subtabs {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.subtab {
  border:1px solid var(--line);
  background:#f7f9fb;
  color:var(--ink);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  font:inherit;
  font-size:15px;
  font-weight:700;
  transition:.18s;
}
.subtab:hover { border-color:#9cb86c; transform:translateY(-1px); }
.subtab.active {
  background:var(--navy);
  border-color:var(--navy);
  color:white;
}
.tab {
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  padding:13px 14px;
  text-align:left;
  cursor:pointer;
  transition:.18s;
  color:var(--ink);
  min-height:112px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
  gap:0;
}
.tab-number {
  display:block;
  font-size:14px;
  line-height:1.15;
  font-weight:800;
  letter-spacing:.7px;
  color:var(--muted);
  margin-bottom:6px;
}
.tab.active .tab-number { color:#d7e2ed; }
.tab-title { display:block;font-size:16px;line-height:1.35;font-weight:800;letter-spacing:0;white-space:nowrap; }
.tab:hover { transform:translateY(-2px);border-color:#9cb86c; }
.category-tabs .tab.active {
  background:var(--navy);
  color:#ffffff;
  border-color:var(--navy);
  box-shadow:0 7px 18px #24496b35;
}
.tab.active {
  background:var(--navy);
  color:white;
  border-color:var(--navy);
  box-shadow:0 7px 18px #24496b20;
}
.tab small {
  display:block;
  margin-top:7px;
  font-size:13px;
  line-height:1.5;
  color:var(--muted);
}
.tab.active small { color:#d7e2ed; }
.panel {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(18px,3vw,30px);
  box-shadow:0 8px 28px #14243b08;
}
.panel-head {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:20px;
}
.kicker {
  font-size:13px;
  letter-spacing:1.5px;
  color:#76913e;
  font-weight:850;
}
.panel h3 { font-size:28px;margin:5px 0; }
.english { font-size:14px;color:var(--muted); }
.tag {
  background:var(--blue);
  color:#38577d;
  border-radius:7px;
  padding:7px 10px;
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}
.definition { font-size:17px;line-height:1.85;margin:0 0 20px; }
.formula {
  background:var(--navy);
  color:white;
  padding:15px 17px;
  border-radius:11px;
  font-size:17px;
  font-weight:750;
  margin:12px 0;
}
.formula small {
  display:block;
  color:#d0dce8;
  font-size:14px;
  font-weight:450;
  margin-top:6px;
}
.grid {
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px;
}
.section {
  border:1px solid var(--line);
  border-radius:13px;
  padding:17px;
  min-width:0;
}
.section h4 { margin:0 0 12px;font-size:17px; }
.section p {
  font-size:16px;
  line-height:1.8;
  color:#4c5b6d;
  margin:0;
}
/* CTL／ATL／TSB 整合判讀：左側表格的指標名稱保持單行 */
.grid .section:first-child th:first-child,
.grid .section:first-child td:first-child {
  white-space:nowrap;
}
table { border-collapse:collapse;width:100%;font-size:14px; }
th {
  text-align:left;
  color:#687789;
  background:#f5f7f9;
  font-weight:750;
}
td,th {
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
tr:last-child td { border-bottom:0; }
.magnitude { margin-top:16px; }
.magnitude h4 { margin:0 0 12px;font-size:17px; }
.magnitude-caption {
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
  margin:10px 0 0;
}
.source {
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.source h4 { font-size:16px;margin:0 0 9px; }
.source ul { margin:0;padding-left:18px; }
.source li {
  font-size:14px;
  line-height:1.8;
  color:var(--muted);
  margin:3px 0;
}
a { color:#315f91;text-decoration:none; }
a:hover { text-decoration:underline; }
.note {
  margin-top:17px;
  background:#fff8e8;
  border:1px solid #f2e4c4;
  padding:14px 16px;
  border-radius:11px;
  font-size:15px;
  line-height:1.8;
  color:#6d572b;
}
footer {
  text-align:center;
  color:#8a96a5;
  font-size:13px;
  margin-top:24px;
  line-height:1.8;
}
@media(max-width:980px) {
  .category-tabs { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media(max-width:720px) {
  .category-tabs { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .subtabs {
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:3px;
    scrollbar-width:thin;
  }
  .subtab { flex:0 0 auto; white-space:nowrap; }
  .grid { grid-template-columns:1fr; }
  .intro { align-items:start;flex-direction:column; }
  .panel-head { flex-direction:column; }
  .tab { min-height:68px; }
}

/* TSB interactive calculator */
.tsb-calc{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#edf3f9,#fff)}
.tsb-calc h4{margin:0 0 7px;font-size:18px;color:var(--ink)}
.tsb-calc-intro{margin:0 0 16px;color:var(--muted);font-size:15px;line-height:1.75}
.tsb-calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tsb-calc-control{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;min-width:0}
.tsb-calc-control label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:750;margin-bottom:10px}
.tsb-calc-control output{font-size:24px;color:var(--navy);font-weight:850;font-variant-numeric:tabular-nums}
.tsb-calc-control input{width:100%;accent-color:#477da8;cursor:pointer}
.tsb-calc-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.tsb-calc-result{margin-top:12px;padding:18px;border:1px solid #cfdae6;border-radius:11px;background:#eaf1f8;text-align:center}
.tsb-calc-result small{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.tsb-calc-number{font-size:42px;line-height:1.2;font-weight:850;color:var(--navy);font-variant-numeric:tabular-nums}
.tsb-calc-formula{margin-top:5px;color:var(--muted);font-size:15px}
.tsb-calc-status{display:inline-block;margin-top:10px;padding:6px 11px;border-radius:30px;font-size:14px;font-weight:800;background:#edf0f3;color:#526174}
.tsb-calc-status.positive{color:#176d54;background:#def2e9}
.tsb-calc-status.negative{color:#8a5b16;background:#fff0d4}
.tsb-calc-explain{margin:12px 0 0;color:#4c5b6d;font-size:15px;line-height:1.8}
.tsb-calc-actions{display:flex;justify-content:flex-end;margin-top:12px}
.tsb-calc-reset{border:1px solid #cbd5df;border-radius:8px;background:#fff;color:var(--ink);padding:8px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
@media(max-width:620px){.tsb-calc{padding:15px}.tsb-calc-grid{grid-template-columns:1fr}.tsb-calc-number{font-size:36px}}


/* 教學示意圖 */
.diagram-card {
  margin:18px 0 22px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(145deg,#fbfcfe,#f4f7fa);
  overflow:hidden;
}
.diagram-heading {
  display:flex;align-items:center;gap:9px;
  margin:0 0 5px;font-size:17px;font-weight:850;color:var(--navy);
}
.diagram-heading:before {
  content:"";width:4px;height:17px;border-radius:5px;background:var(--lime);
}
.diagram-caption {margin:0 0 12px;color:var(--muted);font-size:15px;line-height:1.65}
.diagram-svg {display:block;width:100%;height:auto;max-height:310px}
.diagram-note {margin:10px 0 0;padding:10px 12px;border-radius:9px;background:#fff;color:#536276;font-size:14px;line-height:1.65}
.diagram-label {font:700 14px Inter,"Noto Sans TC",sans-serif;fill:#24364b}
.diagram-small {font:500 12px Inter,"Noto Sans TC",sans-serif;fill:#536276}
.diagram-axis {stroke:#9aa8b8;stroke-width:1.4;fill:none}
.diagram-line {stroke:#24496b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:620px){
  .diagram-card{padding:13px;margin:14px 0 18px}
  .diagram-svg{max-height:260px}
  .diagram-label{font-size:13px}
  .diagram-small{font-size:11px}
}

</style>
</head>
<body>

<header>
  <div class="eyebrow">KUANGYU STUDIO / COACH EDUCATION</div>
  <div class="brand">TRIATHLON COACH LAB</div>
  <div class="sub">
    鐵人三項訓練數據教室｜把數字看懂，再把數據變成訓練決策。
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div>
      <h2>訓練數據快速查詢</h2>
      <p>選擇下方主題，從訓練負荷、生理恢復、訓練週期，以及游泳、自行車、跑步三項強度與課表設計，逐步把數據轉化為課表決策。</p>
    </div>
    <span class="pill">COACH TOOLKIT · 01</span>
  </div>

  <nav class="category-tabs" id="categoryTabs" aria-label="教學主分類">
    <button class="tab active" data-category="load">
      <span class="tab-number">01</span><b class="tab-title">訓練負荷分析</b><small>單次負荷、CTL、ATL、TSB 與 Ramp Rate</small>
    </button>
    <button class="tab" data-category="physiology">
      <span class="tab-number">02</span><b class="tab-title">生理指標與恢復</b><small>HRV、心率、睡眠、壓力與訓練強度</small>
    </button>
    <button class="tab" data-category="planning">
      <span class="tab-number">03</span><b class="tab-title">訓練週期與賽季</b><small>訓練階段與年度訓練計畫</small>
    </button>
    <button class="tab" data-category="practice">
      <span class="tab-number">04</span><b class="tab-title">教練實戰與案例</b><small>整合數據、辨識問題與訓練決策</small>
    </button>
    <button class="tab" data-category="running">
      <span class="tab-number">05</span><b class="tab-title">跑步強度與能力發展</b><small>心率 Zone、E/M/T/I/R、五大能力與課表設計</small>
    </button>
    <button class="tab" data-category="cycling">
      <span class="tab-number">06</span><b class="tab-title">自行車強度與功率</b><small>FTP、功率 Zone、閾值心率與騎乘課表</small>
    </button>
    <button class="tab" data-category="swimming">
      <span class="tab-number">07</span><b class="tab-title">游泳強度與配速</b><small>CSS、T-time、配速區間與游泳課表</small>
    </button>
  </nav>
  <div class="subnav-wrap">
    <div class="subnav-label" id="subnavLabel"></div>
    <nav class="subtabs" id="subtabs" aria-label="分類內學習單元"></nav>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>

  <footer>
    本工具為教學與訓練討論參考，不是醫療診斷、醫療安全門檻或個人化處方。
    數值需依運動項目、測試方法、閾值設定、訓練背景與個人反應解讀。<br>
    KUANGYU STUDIO · TRIATHLON COACH LAB
  </footer>
</main>

<script>
const data = {
  tss:{
    title:"TSS｜訓練壓力分數",en:"Training Stress Score",tag:"單次訓練負荷",
    desc:"TSS 是以訓練時間與相對強度估算單次訓練負荷的指標。TrainingPeaks 的經典參考以單堂 TSS 描述訓練負荷；不同運動項目的 TSS 算法與尺度不完全相同。",
    formula:"自行車功率 TSS = 時數 × IF² × 100",
    fsub:"此為自行車功率 TSS 的簡化公式。跑步、游泳及心率估算的負荷算法不同。",
    heads:["單堂 TSS","TrainingPeaks 參考量級","恢復參考"],
    rows:[
      ["低於 150","低","通常隔天恢復大致完成"],

    example:"自行車訓練 1.5 小時，IF = 0.70：TSS = 1.5 × 0.70² × 100 ≈ 73.5。這是公式示範，不是個人課表目標。",
    coach:"確認 FTP／閾值設定有效，再看單堂負荷、每週分布、訓練階段與恢復反應。每週 TSS 建議追蹤個人趨勢，不用通用分級替所有選手評分。",
    note:"150／300／450 是 TrainingPeaks 教育文章中的單堂 TSS 參考量級，不是醫療安全界線。TSS 不是疲勞百分比，也不是課表品質分數。bike TSS、rTSS、sTSS 不應視為完全等價。",
    extraTitle:"每週 TSS｜建議看個人趨勢，不套用通用高低分級",
    extraHeads:["觀察項目","教練判讀"],
    extraRows:[
      ["本週與過去 3–6 週比較","是否突然增加？是否符合選手背景？"],
      ["三項負荷分布","自行車、跑步、游泳分別觀察，不只看總和"],
      ["高負荷日與恢復日","是否有足夠恢復空間？是否連續堆疊高負荷？"],

  if:{

  lt:{
    title:"LT｜乳酸閾值",en:"Lactate Threshold",tag:"理解生理轉折與訓練應用",
    desc:"乳酸閾值不是乳酸突然「堆積」的單一開關，而是運動強度提高時，血乳酸濃度與清除／利用能力之間的動態平衡逐漸改變，所呈現出的轉折區域。常用 LT1 與 LT2 描述兩個不同強度層級；實際位置會受測試協定、取樣頻率、判讀模型、運動項目與個體狀態影響。",
    heads:["概念","生理意義與教練判讀"],
    rows:[

      ["LT2｜第二乳酸閾值","較高強度下，血乳酸上升速度明顯加快的第二個轉折或相關判讀點。常用來描述高強度持續能力的上緣；接近或高於此強度時，維持時間通常縮短。"],
      ["閾值心率／配速／功率","是測試時與 LT1 或 LT2 對應的外在／內在指標。跑步、騎車、游泳要分項建立；同一人的不同項目數值不可直接互換。"],
      ["乳酸生成與清除","乳酸持續生成，也會被其他肌纖維與器官利用或氧化。血乳酸濃度反映生成、轉運、利用與清除的整體結果，不是單純比較「生成是否大於代謝」就能完整解釋。"]
    ],
    example:"假設某跑者測得 LT1 約 145 bpm、LT2 約 170 bpm。低於 145 bpm 可先視為 LT1 以下的低強度範圍；145–170 bpm 是兩閾值之間；接近或高於 170 bpm 則進入 LT2 附近或以上的高強度範圍。這只是示範，實際區間仍須依測試方法與個人反應設定。",
    coach:"判讀時先問：測的是哪個運動項目？使用何種測試協定？閾值是以乳酸曲線、通氣閾值還是場地估算得出？再把閾值對應到心率、配速或功率。心率有反應延遲，短間歇不宜只靠心率控強度；配速會受坡度、氣候與路面影響；功率也要確認設備與測試條件。",
    note:"LT1 不等於 Tempo，LT2 也不等於所有系統中的 FTP、CP 或 MLSS。Tempo 是訓練術語，各教練與課表系統的定義可能不同，常落在 LT1–LT2 之間的某個範圍，也可能接近 LT2。沒有乳酸測試時，可用談話測試、RPE、通氣反應或場地表現作估算，但應清楚標示為估算／代理指標，而不是直接宣稱測得 LT。",
    extraTitle:"LT1 與 LT2 之間｜三個生理強度區域",
    extraHeads:["區域","相對位置","訓練與體感上的常見特徵"],
    extraRows:[
      ["Zone 1｜低強度","低於 LT1","通常可完整交談、呼吸較可控；適合累積有氧時間與恢復。長時間運動仍需看補給、肌肉負荷與個人耐受。"],
      ["Zone 2｜中等／重度範圍","LT1 至 LT2 之間","呼吸與主觀用力逐漸提高，說話變得較短；可包含穩定耐力、Tempo 或部分閾值導向訓練，不能把整段一概稱為 Tempo。"],

    extraCaption:"這是以 LT1／LT2 為界的三區生理模型（常稱三區模型），不是跑步 Friel 七區、Coggan 功率區或平台自訂 Zone。不同分區系統的 Zone 1、2、3 名稱可能相同，但界線不一定相同。",

function makeTable(headers, rows) {
  return `
    <table>
      <thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(row=>`<tr>${row.map(value=>`<td>${value}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

            ["2｜看長期趨勢","CTL 最近 4–6 週是上升、持平還是下降？","判斷長期訓練負荷是否符合目前階段，不用單日數字下結論。"],
            ["3｜看近期刺激","ATL 最近約 7 天是否明顯增加或下降？","回看訓練時間、強度、頻率，以及高負荷日是否集中。"],
            ["4｜看負荷平衡","TSB 的方向是否符合目前訓練安排？","把 TSB 當作負荷差距線索，不把正負值直接當成恢復或安全判定。"],
            ["5｜對照運動員反應","配速／功率、心率、RPE、睡眠、痠痛與情緒是否同步變化？","依整體資訊決定維持、調整、恢復或減量，並追蹤後續反應。"]
          ]
        )}
      </div>
      <div class="section magnitude">
        <h4>情境練習｜讀懂恢復週與 Taper 的差別</h4>
        ${makeTable(
          ["觀察情境","數據可能呈現","教練判讀"],
          [
            ["訓練累積後安排恢復週","ATL 下降較快；CTL 持平或微降；TSB 上升","目的是降低近期負荷、促進恢復與吸收訓練，不是追求 CTL 繼續上升。"],
            ["比賽前進入 Taper","ATL 下降；CTL 通常緩慢下降；TSB 上升","目的是降低累積疲勞並盡量保留專項能力，不代表完全停止訓練。"],
            ["ATL 上升但表現與恢復變差","CTL、ATL、TSB 可能出現不同組合","回看負荷增加來源、課表完成品質與身體反應；必要時調整負荷並進一步評估。"]
          ]
        )}
        <p class="magnitude-caption">恢復週是訓練計畫中的定期負荷調整；Taper 則通常以重要賽事為目標。兩者可能都讓 ATL 下降、TSB 上升，但目的與安排背景不同。</p>
      </div>
      <div class="section magnitude">
        <h4>常見誤判｜這些結論不能只靠三個數字得出</h4>
        ${makeTable(
          ["不要直接推論","更好的判讀方式"],
          [
            ["CTL 上升＝體能一定進步","再看專項測試、配速／功率、心率反應與訓練完成品質。"],
            ["ATL 上升＝過度訓練","先確認是否為計畫中的訓練累積，再看疲勞、疼痛、睡眠與表現。"],
            ["TSB 正值＝完全恢復、適合衝強度","搭配主觀狀態、熱身反應與專項表現，確認是否適合當天課表。"],
            ["TSB 負值＝一定要休息","看負值的持續時間、幅度、訓練階段及個人反應，不用單一門檻下指令。"]
          ]
        )}
      </div>
    ` : ""}

    <div class="note">
      <b>重要提醒</b><br>
      ${d.note}
    </div>

    <div class="source">
      <h4>資料來源</h4>
      <ul>${sourceList}</ul>
    </div>
  `;

  if (key === "bikepower") {
    const input=document.getElementById("bikeFtpInput"), output=document.getElementById("bikeFtpValue"), results=document.getElementById("bikePowerResults");
    const round=Math.round;
    function updateBikePower(){
      const ftp=Number(input.value); output.textContent=ftp;
      const zones=[["Z1｜恢復",0,0.55,true],["Z2｜耐力",0.56,0.75,false],["Z3｜Tempo",0.76,0.90,false],["Z4｜閾值",0.91,1.05,false],["Z5｜VO₂max",1.06,1.20,false],["Z6｜無氧能力",1.20,null,false]];
      results.innerHTML=zones.map((z,i)=>{const low=z[3]?"<":String(round(ftp*z[1]));const range=i===0?`低於 ${round(ftp*0.55)} W`:i===5?`高於 ${round(ftp*1.20)} W`:`${round(ftp*z[1])}–${round(ftp*z[2])} W`;return `<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e3e8ee;padding:5px 0"><b>${z[0]}</b><span style="font-variant-numeric:tabular-nums">${range}</span></div>`}).join("")+`<div style="padding-top:7px"><b>Z7｜神經肌肉衝刺：</b>不以固定 FTP 百分比設定，參考個人短時間峰值功率與動作品質。</div>`;
    }
    input.addEventListener("input",updateBikePower); updateBikePower();
  }
  if (key === "swimguide") {
    const a=document.getElementById("swim200Input"), b=document.getElementById("swim400Input"), ao=document.getElementById("swim200Value"), bo=document.getElementById("swim400Value"), value=document.getElementById("swimCssValue"), formula=document.getElementById("swimCssFormula"), status=document.getElementById("swimCssStatus"), explain=document.getElementById("swimCssExplain");
    const fmt=sec=>`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
    function updateCss(){const t200=Number(a.value),t400=Number(b.value);ao.textContent=fmt(t200);bo.textContent=fmt(t400);const css=(t400-t200)/2;if(t400<=t200*1.5){value.textContent="—";formula.textContent="請確認 400m 測試時間應大於 200m 時間的 1.5 倍";status.textContent="測試時間組合需檢查";status.className="tsb-calc-status negative";explain.textContent="請確認輸入的是同一泳池長度、同一泳姿且有效的 200m 與 400m 測試成績。";return;}value.textContent=fmt(Math.round(css));formula.textContent=`(${t400} − ${t200}) ÷ 2 = ${Math.round(css)} 秒／100m`;status.textContent="可用作閾值附近配速參考";status.className="tsb-calc-status positive";explain.textContent="此為估算 CSS；如果測試配速策略不穩、轉身或技術差異明顯，結果可能失真。";}
    a.addEventListener("input",updateCss);b.addEventListener("input",updateCss);updateCss();
  }

  if (key === "tsb") {
    const ctlInput = document.getElementById("tsbCtlInput");
    const atlInput = document.getElementById("tsbAtlInput");
    const ctlOutput = document.getElementById("tsbCtlValue");
    const atlOutput = document.getElementById("tsbAtlValue");
    const result = document.getElementById("tsbCalcValue");
    const formula = document.getElementById("tsbCalcFormula");
    const status = document.getElementById("tsbCalcStatus");
    const explain = document.getElementById("tsbCalcExplain");
    const reset = document.getElementById("tsbCalcReset");
    const format = value => value > 0 ? "+" + value : String(value).replace("-", "−");

    function updateTsbCalculator() {
      const ctl = Number(ctlInput.value);
      const atl = Number(atlInput.value);
      const tsb = ctl - atl;
      ctlOutput.textContent = ctl;
      atlOutput.textContent = atl;
      result.textContent = format(tsb);
      formula.textContent = ctl + " − " + atl + " = " + format(tsb);
      status.className = "tsb-calc-status" + (tsb > 0 ? " positive" : tsb < 0 ? " negative" : "");
      if (tsb > 0) {
        status.textContent = "正值｜近期負荷較低";
        explain.textContent = "近期負荷低於長期負荷，可能代表近期訓練量降低或進入恢復／減量階段；仍需搭配實際恢復與表現判讀。";
      } else if (tsb < 0) {
        status.textContent = "負值｜近期負荷較高";
        explain.textContent = "近期負荷高於長期負荷，可能出現在訓練負荷累積階段；不能單憑負值判定過度訓練，需搭配運動員的恢復與表現。";
      } else {
        status.textContent = "零值｜兩者相近";
        explain.textContent = "近期負荷與長期負荷基準相同。這只描述負荷關係，不代表運動員一定疲勞或完全恢復。";
      }
    }
    ctlInput.addEventListener("input", updateTsbCalculator);
    atlInput.addEventListener("input", updateTsbCalculator);
    reset.addEventListener("click", () => {
      ctlInput.value = 80;
      atlInput.value = 100;
      updateTsbCalculator();
    });
    updateTsbCalculator();
  }

  if (key === "runzones") {
    const input = document.getElementById("runLthrInput");
    const output = document.getElementById("runLthrValue");
    const results = document.getElementById("runZoneResults");
    const round = value => Math.round(value);
    function updateRunZones() {
      const lthr = Number(input.value);
      output.textContent = lthr;
      const zones = [
        ["Z1｜恢復", null, 0.85],
        ["Z2｜有氧耐力", 0.85, 0.89],
        ["Z3｜Tempo／穩定有氧", 0.90, 0.94],
        ["Z4｜閾值附近", 0.95, 0.99],
        ["Z5a｜閾值以上", 1.00, 1.02],
        ["Z5b｜高強度有氧", 1.03, 1.06],
        ["Z5c｜極高強度", 1.06, null]
      ];
      results.innerHTML = zones.map((z, i) => {
        let range = "";
        if (i === 0) range = "≤ " + (round(lthr * 0.85) - 1) + " bpm";
        else if (i === 6) range = "≥ " + (round(lthr * 1.06) + 1) + " bpm";
        else range = round(lthr * z[1]) + "–" + round(lthr * z[2]) + " bpm";
        return `<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e3e8ee;padding:5px 0"><b>${z[0]}</b><span style="font-variant-numeric:tabular-nums">${range}</span></div>`;
      }).join("");
    }
    input.addEventListener("input", updateRunZones);
    updateRunZones();
  }
}

const categoryConfig = {
  load: {
    label:"TRAINING LOAD ANALYSIS｜訓練負荷分析",
    items:[
      ["tss","TSS｜單次負荷"],["if","IF｜強度係數"],
      ["ctl","CTL｜長期負荷"],["atl","ATL｜近期負荷"],

      ["triintensity","三項運動強度整合比較"]
    ]
  },

    label:"COACHING PRACTICE｜教練實戰與案例分析",
    items:[["practice","個案分析流程與紀錄模板"]]
  }
};

function categoryFor(key) {
  return Object.keys(categoryConfig).find(category =>
    categoryConfig[category].items.some(item => item[0] === key)
  ) || "load";
}

function renderCategory(category, selectedKey) {
  const config = categoryConfig[category];
  document.getElementById("subnavLabel").textContent = config.label;
  document.querySelectorAll("#categoryTabs [data-category]").forEach(button => {
    button.classList.toggle("active", button.dataset.category === category);
  });
  document.getElementById("subtabs").innerHTML = config.items.map(([key,label]) =>
    `<button class="subtab ${key === selectedKey ? "active" : ""}" data-key="${key}">${label}</button>`
  ).join("");
}

document.getElementById("categoryTabs").addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;
  const category = button.dataset.category;
  const firstKey = categoryConfig[category].items[0][0];
  renderCategory(category, firstKey);
  render(firstKey);
});

document.getElementById("subtabs").addEventListener("click", event => {
  const button = event.target.closest("button[data-key]");
  if (button) render(button.dataset.key);
});

const originalRender = render;
render = function(key) {
  const category = categoryFor(key);
  renderCategory(category, key);
  originalRender(key);
};

render("tss");
</script>
