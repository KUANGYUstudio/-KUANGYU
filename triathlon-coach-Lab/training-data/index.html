<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2d">
<title>Triathlon Coach Lab｜鐵人三項數據教室</title>
<style>
:root {
  --bg:#f4f6f8;
  --ink:#172338;
  --muted:#697789;
  --navy:#101b2d;
  --lime:#c7f36b;
  --line:#e3e8ee;
  --card:#fff;
  --blue:#eaf1fb;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans TC",sans-serif;
}
header {
  background:var(--navy);
  color:white;
  padding:34px max(22px,calc((100% - 1120px)/2)) 28px;
  position:relative;
  overflow:hidden;
}
header:after {
  content:"";
  position:absolute;
  width:300px;height:300px;
  border:1px solid #ffffff18;
  border-radius:50%;
  right:8%;top:-190px;
  box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05;
}
.eyebrow {
  color:var(--lime);
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}
.brand {
  font-size:clamp(26px,4vw,38px);
  font-weight:850;
  letter-spacing:-1px;
  margin:10px 0 6px;
}
.sub {
  color:#b8c4d2;
  font-size:14px;
  max-width:650px;
  line-height:1.7;
}
.wrap {
  max-width:1120px;
  margin:0 auto;
  padding:26px 22px 60px;
}
.intro {
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end;
  margin-bottom:18px;
}
.intro h2 { font-size:19px;margin:0 0 5px; }
.intro p { margin:0;color:var(--muted);font-size:13px; }
.pill {
  font-size:11px;
  font-weight:750;
  background:#eaf5d8;
  color:#46631d;
  border-radius:30px;
  padding:8px 12px;
  white-space:nowrap;
}
.tabs {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0 20px;
}
.tab {
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  padding:14px 15px;
  text-align:left;
  cursor:pointer;
  transition:.18s;
  color:var(--ink);
  min-height:76px;
}
.tab:hover { transform:translateY(-2px);border-color:#9cb86c; }
.tab.active {
  background:var(--navy);
  color:white;
  border-color:var(--navy);
  box-shadow:0 7px 18px #101b2d20;
}
.tab b { display:block;font-size:17px;letter-spacing:.3px; }
.tab small {
  display:block;
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}
.tab.active small { color:#c2cbd7; }
.panel {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(18px,3vw,30px);
  box-shadow:0 8px 28px #14243b08;
}
.panel-head {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:20px;
}
.kicker {
  font-size:11px;
  letter-spacing:1.5px;
  color:#76913e;
  font-weight:850;
}
.panel h3 { font-size:26px;margin:5px 0; }
.english { font-size:12px;color:var(--muted); }
.tag {
  background:var(--blue);
  color:#38577d;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
}
.definition { font-size:15px;line-height:1.85;margin:0 0 20px; }
.formula {
  background:var(--navy);
  color:white;
  padding:15px 17px;
  border-radius:11px;
  font-size:15px;
  font-weight:750;
  margin:12px 0;
}
.formula small {
  display:block;
  color:#b8c4d2;
  font-size:11px;
  font-weight:450;
  margin-top:6px;
}
.grid {
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px;
}
.section {
  border:1px solid var(--line);
  border-radius:13px;
  padding:17px;
  min-width:0;
}
.section h4 { margin:0 0 12px;font-size:14px; }
.section p {
  font-size:13px;
  line-height:1.8;
  color:#4c5b6d;
  margin:0;
}
/* CTL／ATL／TSB 整合判讀：左側表格的指標名稱保持單行 */
.grid .section:first-child th:first-child,
.grid .section:first-child td:first-child {
  white-space:nowrap;
}
table { border-collapse:collapse;width:100%;font-size:12px; }
th {
  text-align:left;
  color:#687789;
  background:#f5f7f9;
  font-weight:750;
}
td,th {
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
tr:last-child td { border-bottom:0; }
.magnitude { margin-top:16px; }
.magnitude h4 { margin:0 0 12px;font-size:14px; }
.magnitude-caption {
  color:var(--muted);
  font-size:11px;
  line-height:1.75;
  margin:10px 0 0;
}
.source {
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.source h4 { font-size:13px;margin:0 0 9px; }
.source ul { margin:0;padding-left:18px; }
.source li {
  font-size:11px;
  line-height:1.8;
  color:var(--muted);
  margin:3px 0;
}
a { color:#315f91;text-decoration:none; }
a:hover { text-decoration:underline; }
.note {
  margin-top:17px;
  background:#fff8e8;
  border:1px solid #f2e4c4;
  padding:14px 16px;
  border-radius:11px;
  font-size:12px;
  line-height:1.8;
  color:#6d572b;
}
footer {
  text-align:center;
  color:#8a96a5;
  font-size:11px;
  margin-top:24px;
  line-height:1.8;
}
@media(max-width:720px) {
  .tabs { grid-template-columns:repeat(2,1fr); }
  .grid { grid-template-columns:1fr; }
  .intro { align-items:start;flex-direction:column; }
  .panel-head { flex-direction:column; }
  .tab { min-height:68px; }
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">KUANGYU STUDIO / COACH EDUCATION</div>
  <div class="brand">TRIATHLON COACH LAB</div>
  <div class="sub">
    鐵人三項訓練數據教室｜把數字看懂，再把數據變成訓練決策。
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div>
      <h2>訓練數據快速查詢</h2>
      <p>選擇下方指標，查看定義、官方參考、量級示意、教練判讀與資料來源。</p>
    </div>
    <span class="pill">COACH TOOLKIT · 01</span>
  </div>

  <nav class="tabs" id="tabs" aria-label="數據指標">
    <button class="tab active" data-key="tss">
      <b>TSS</b><small>單次訓練負荷</small>
    </button>
    <button class="tab" data-key="if">
      <b>IF</b><small>強度係數</small>
    </button>
    <button class="tab" data-key="ctl">
      <b>CTL</b><small>長期訓練負荷</small>
    </button>
    <button class="tab" data-key="atl">
      <b>ATL</b><small>短期訓練負荷</small>
    </button>
    <button class="tab" data-key="tsb">
      <b>TSB</b><small>訓練壓力平衡</small>
    </button>
    <button class="tab" data-key="load">
      <b>CTL × ATL × TSB</b><small>整合判讀與教練應用</small>
    </button>
    <button class="tab" data-key="cycle">
      <b>TRAINING CYCLE</b><small>基礎期、強化期、恢復週與 Taper</small>
    </button>
    <button class="tab" data-key="lt">
      <b>LT</b><small>乳酸閾值</small>
    </button>
    <button class="tab" data-key="zones">
      <b>TRAINING ZONES</b><small>訓練強度區間</small>
    </button>
    <button class="tab" data-key="css">
      <b>CSS</b><small>游泳臨界配速</small>
    </button>
    <button class="tab" data-key="atp">
      <b>ATP</b><small>年度訓練量參考</small>
    </button>
  </nav>

  <section class="panel" id="panel" aria-live="polite"></section>

  <footer>
    本工具為教學與訓練討論參考，不是醫療診斷、醫療安全門檻或個人化處方。
    數值需依運動項目、測試方法、閾值設定、訓練背景與個人反應解讀。<br>
    KUANGYU STUDIO · TRIATHLON COACH LAB
  </footer>
</main>

function makeTable(headers, rows) {
  return `
    <table>
      <thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(row=>`<tr>${row.map(value=>`<td>${value}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

  const sourceList = (d.sources || []).map(source =>
    `<li><a href="${source[1]}" target="_blank" rel="noopener noreferrer">${source[0]}</a></li>`
  ).join("");

  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div>
        <div class="kicker">DATA GUIDE / ${key.toUpperCase()}</div>
        <h3>${d.title}</h3>

        ${d.formula}
        <small>${d.fsub || ""}</small>
      </div>
    ` : ""}

    <div class="grid">
      <div class="section">
        <h4>參考表｜官方或科學依據</h4>
        ${makeTable(d.heads,d.rows)}

        <h4>教練判讀</h4>
        <p>${d.coach}</p>
      </div>
    </div>

    ${extraTable}

    ${key === "load" ? `
      <div class="section magnitude">
        <h4>補充判斷｜不要只看 CTL／ATL／TSB</h4>
        ${makeTable(
          ["搭配資料","觀察問題","對判讀的幫助"],
          [
            ["配速 Pace／功率 Power","相同主觀強度下，輸出是否穩定或進步？","協助確認訓練適應與專項表現。"],
            ["心率 HR","相同配速／功率下，心率反應是否和平常不同？","提供內在負荷線索；需考慮熱、補水、地形與睡眠等因素。"],
            ["RPE 主觀用力程度","同一課表是否感覺比平常更吃力？","補足設備數據無法呈現的主觀反應。"],
            ["睡眠、情緒、痠痛","是否連續數日變差，或出現局部疼痛？","協助辨識恢復不佳或需要進一步評估的訊號。"],
            ["訓練完成率與課表內容","負荷增加來自時數、強度，還是頻率？","找出負荷變化來源，避免只看總分。"]
          ]
        )}
      </div>
      <div class="section magnitude">
        <h4>教練判讀流程｜五步驟</h4>
        ${makeTable(
          ["步驟","判讀任務"],
          [
            ["1｜看 CTL","先看最近 4–6 週長期負荷趨勢，不以單日數字判斷。"],
            ["2｜看 ATL","再看最近約 7 天的負荷變化，找出高負荷日與突然增加。"],
            ["3｜看 TSB","理解近期負荷相對長期基準的差距，並確認平台的日期計算方式。"],
            ["4｜對照反應","搭配配速／功率、心率、RPE、睡眠、情緒、痠痛、疼痛與疾病狀況。"],
            ["5｜做訓練決策","依整體趨勢與選手反應，決定維持、調整負荷或安排恢復；再追蹤後續反應。"]
          ]
        )}
      </div>
    ` : ""}

    ${key === "cycle" ? `
      <div class="section magnitude">
        <h4>教練判讀流程｜從週期走向決策</h4>
        ${makeTable(
          ["步驟","先問自己什麼？","可採取的教練行動"],
          [
            ["1｜確認目標","目前距離 A 級賽事還有多久？目前屬於賽季哪個階段？","先確認賽事目標、專項需求與整體訓練計畫。"],
            ["2｜看長期趨勢","CTL 最近 4–6 週是上升、持平還是下降？","判斷長期訓練負荷是否符合目前階段，不用單日數字下結論。"],
            ["3｜看近期刺激","ATL 最近約 7 天是否明顯增加或下降？","回看訓練時間、強度、頻率，以及高負荷日是否集中。"],
            ["4｜看負荷平衡","TSB 的方向是否符合目前訓練安排？","把 TSB 當作負荷差距線索，不把正負值直接當成恢復或安全判定。"],
            ["5｜對照運動員反應","配速／功率、心率、RPE、睡眠、痠痛與情緒是否同步變化？","依整體資訊決定維持、調整、恢復或減量，並追蹤後續反應。"]
          ]
        )}
      </div>
      <div class="section magnitude">
        <h4>情境練習｜讀懂恢復週與 Taper 的差別</h4>
        ${makeTable(
          ["觀察情境","數據可能呈現","教練判讀"],
          [
            ["訓練累積後安排恢復週","ATL 下降較快；CTL 持平或微降；TSB 上升","目的是降低近期負荷、促進恢復與吸收訓練，不是追求 CTL 繼續上升。"],
            ["比賽前進入 Taper","ATL 下降；CTL 通常緩慢下降；TSB 上升","目的是降低累積疲勞並盡量保留專項能力，不代表完全停止訓練。"],
            ["ATL 上升但表現與恢復變差","CTL、ATL、TSB 可能出現不同組合","回看負荷增加來源、課表完成品質與身體反應；必要時調整負荷並進一步評估。"]
          ]
        )}
        <p class="magnitude-caption">恢復週是訓練計畫中的定期負荷調整；Taper 則通常以重要賽事為目標。兩者可能都讓 ATL 下降、TSB 上升，但目的與安排背景不同。</p>
      </div>
      <div class="section magnitude">
        <h4>常見誤判｜這些結論不能只靠三個數字得出</h4>
        ${makeTable(
          ["不要直接推論","更好的判讀方式"],
          [
            ["CTL 上升＝體能一定進步","再看專項測試、配速／功率、心率反應與訓練完成品質。"],
            ["ATL 上升＝過度訓練","先確認是否為計畫中的訓練累積，再看疲勞、疼痛、睡眠與表現。"],
            ["TSB 正值＝完全恢復、適合衝強度","搭配主觀狀態、熱身反應與專項表現，確認是否適合當天課表。"],
            ["TSB 負值＝一定要休息","看負值的持續時間、幅度、訓練階段及個人反應，不用單一門檻下指令。"]
          ]
        )}
      </div>
    ` : ""}

    <div class="note">
      <b>重要提醒</b><br>
      ${d.note}
    </div>

    <div class="source">
      <h4>資料來源</h4>
      <ul>${sourceList}</ul>
    </div>
  `;
}

document.getElementById("tabs").addEventListener("click",event=>{
  const button=event.target.closest("button[data-key]");
  if(button) render(button.dataset.key);
});

render("tss");
</script>

</body>
</html>
