<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24496b">
<title>Triathlon Coach Lab｜鐵人三項數據教室</title>
<style>
:root {
  --bg:#f4f6f8;
  --ink:#172338;
  --muted:#697789;
  --navy:#24496b;
  --lime:#c7f36b;
  --line:#e3e8ee;
  --card:#fff;
  --blue:#eaf1fb;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI","Noto Sans TC",sans-serif;
}
header {
  background:var(--navy);
  color:white;
  padding:34px max(22px,calc((100% - 1120px)/2)) 28px;
  position:relative;
  overflow:hidden;
}
header:after {
  content:"";
  position:absolute;
  width:300px;height:300px;
  border:1px solid #ffffff18;
  border-radius:50%;
  right:8%;top:-190px;
  box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05;
}
.eyebrow {
  color:var(--lime);
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
}
.brand {
  font-size:clamp(26px,4vw,38px);
  font-weight:850;
  letter-spacing:-1px;
  margin:10px 0 6px;
}
.sub {
  color:#d0dce8;
  font-size:14px;
  max-width:650px;
  line-height:1.7;
}
.wrap {
  max-width:1120px;
  margin:0 auto;
  padding:26px 22px 60px;
}
.intro {
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:end;
  margin-bottom:18px;
}
.intro h2 { font-size:19px;margin:0 0 5px; }
.intro p { margin:0;color:var(--muted);font-size:13px; }
.pill {
  font-size:11px;
  font-weight:750;
  background:#eaf5d8;
  color:#46631d;
  border-radius:30px;
  padding:8px 12px;
  white-space:nowrap;
}
.category-tabs {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0 12px;
}
.subnav-wrap {
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 14px;
  margin-bottom:20px;
}
.subnav-label {
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  margin:0 0 9px;
}
.subtabs {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.subtab {
  border:1px solid var(--line);
  background:#f7f9fb;
  color:var(--ink);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  font:inherit;
  font-size:12px;
  font-weight:700;
  transition:.18s;
}
.subtab:hover { border-color:#9cb86c; transform:translateY(-1px); }
.subtab.active {
  background:var(--navy);
  border-color:var(--navy);
  color:white;
}
.tab {
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  padding:14px 15px;
  text-align:left;
  cursor:pointer;
  transition:.18s;
  color:var(--ink);
  min-height:76px;
}
.tab:hover { transform:translateY(-2px);border-color:#9cb86c; }
.tab.active {
  background:var(--navy);
  color:white;
  border-color:var(--navy);
  box-shadow:0 7px 18px #24496b20;
}
.tab b { display:block;font-size:17px;letter-spacing:.3px; }
.tab small {
  display:block;
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}
.tab.active small { color:#d7e2ed; }
.panel {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(18px,3vw,30px);
  box-shadow:0 8px 28px #14243b08;
}
.panel-head {
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:20px;
}
.kicker {
  font-size:11px;
  letter-spacing:1.5px;
  color:#76913e;
  font-weight:850;
}
.panel h3 { font-size:26px;margin:5px 0; }
.english { font-size:12px;color:var(--muted); }
.tag {
  background:var(--blue);
  color:#38577d;
  border-radius:7px;
  padding:7px 10px;
  font-size:11px;
  font-weight:750;
  white-space:nowrap;
}
.definition { font-size:15px;line-height:1.85;margin:0 0 20px; }
.formula {
  background:var(--navy);
  color:white;
  padding:15px 17px;
  border-radius:11px;
  font-size:15px;
  font-weight:750;
  margin:12px 0;
}
.formula small {
  display:block;
  color:#d0dce8;
  font-size:11px;
  font-weight:450;
  margin-top:6px;
}
.grid {
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:16px;
}
.section {
  border:1px solid var(--line);
  border-radius:13px;
  padding:17px;
  min-width:0;
}
.section h4 { margin:0 0 12px;font-size:14px; }
.section p {
  font-size:13px;
  line-height:1.8;
  color:#4c5b6d;
  margin:0;
}
/* CTL／ATL／TSB 整合判讀：左側表格的指標名稱保持單行 */
.grid .section:first-child th:first-child,
.grid .section:first-child td:first-child {
  white-space:nowrap;
}
table { border-collapse:collapse;width:100%;font-size:12px; }
th {
  text-align:left;
  color:#687789;
  background:#f5f7f9;
  font-weight:750;
}
td,th {
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
tr:last-child td { border-bottom:0; }
.magnitude { margin-top:16px; }
.magnitude h4 { margin:0 0 12px;font-size:14px; }
.magnitude-caption {
  color:var(--muted);
  font-size:11px;
  line-height:1.75;
  margin:10px 0 0;
}
.source {
  margin-top:16px;
  border-top:1px solid var(--line);
  padding-top:14px;
}
.source h4 { font-size:13px;margin:0 0 9px; }
.source ul { margin:0;padding-left:18px; }
.source li {
  font-size:11px;
  line-height:1.8;
  color:var(--muted);
  margin:3px 0;
}
a { color:#315f91;text-decoration:none; }
a:hover { text-decoration:underline; }
.note {
  margin-top:17px;
  background:#fff8e8;
  border:1px solid #f2e4c4;
  padding:14px 16px;
  border-radius:11px;
  font-size:12px;
  line-height:1.8;
  color:#6d572b;
}
footer {
  text-align:center;
  color:#8a96a5;
  font-size:11px;
  margin-top:24px;
  line-height:1.8;
}
@media(max-width:720px) {
  .category-tabs { grid-template-columns:repeat(2,1fr); }
  .subtabs {
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:3px;
    scrollbar-width:thin;
  }
  .subtab { flex:0 0 auto; white-space:nowrap; }
  .grid { grid-template-columns:1fr; }
  .intro { align-items:start;flex-direction:column; }
  .panel-head { flex-direction:column; }
  .tab { min-height:68px; }
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">KUANGYU STUDIO / COACH EDUCATION</div>
  <div class="brand">TRIATHLON COACH LAB</div>
  <div class="sub">
    鐵人三項訓練數據教室｜把數字看懂，再把數據變成訓練決策。
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div>
      <h2>訓練數據快速查詢</h2>
      <p>選擇下方指標，查看定義、官方參考、量級示意、教練判讀與資料來源。</p>
    </div>
    <span class="pill">COACH TOOLKIT · 01</span>
  </div>

  <nav class="category-tabs" id="categoryTabs" aria-label="教學主分類">
    <button class="tab active" data-category="load">
      <b>01｜訓練負荷分析</b><small>單次負荷、CTL、ATL、TSB 與 Ramp Rate</small>
    </button>
    <button class="tab" data-category="physiology">
      <b>02｜生理指標與強度</b><small>乳酸閾值、訓練區間與游泳配速</small>
    </button>
    <button class="tab" data-category="planning">
      <b>03｜訓練週期與賽季</b><small>訓練階段與年度訓練計畫</small>
    </button>
    <button class="tab" data-category="practice">
      <b>04｜教練實戰與案例</b><small>整合數據、辨識問題與訓練決策</small>
    </button>
  </nav>
  <div class="subnav-wrap">
    <div class="subnav-label" id="subnavLabel">TRAINING LOAD ANALYSIS｜選擇學習單元</div>
    <nav class="subtabs" id="subtabs" aria-label="分類內學習單元"></nav>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>

  <footer>
    本工具為教學與訓練討論參考，不是醫療診斷、醫療安全門檻或個人化處方。
    數值需依運動項目、測試方法、閾值設定、訓練背景與個人反應解讀。<br>
    KUANGYU STUDIO · TRIATHLON COACH LAB
  </footer>
</main>

function makeTable(headers, rows) {
  return `
    <table>
      <thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(row=>`<tr>${row.map(value=>`<td>${value}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
  `;
}

      ["tss","TSS｜單次負荷"],["if","IF｜強度係數"],
      ["ctl","CTL｜長期負荷"],["atl","ATL｜近期負荷"],
      ["tsb","TSB｜負荷平衡"],["ramp","Ramp Rate｜負荷爬升率"],
      ["load","整合判讀｜教練應用"]
    ]
  },
  physiology: {
    label:"PHYSIOLOGY & INTENSITY｜生理指標與強度設定",
    items:[
      ["lt","LT｜乳酸閾值"],["zones","Training Zones｜強度區間"],
      ["css","CSS｜游泳臨界配速"]
    ]
  },
  planning: {
    label:"TRAINING PLAN｜訓練週期與賽季規劃",
    items:[
      ["cycle","Training Cycle｜訓練週期"],["atp","ATP｜年度訓練計畫"]
    ]
  },
  practice: {
    label:"COACHING PRACTICE｜教練實戰與案例分析",
    items:[["practice","個案分析流程與紀錄模板"]]
  }
};

function categoryFor(key) {
  return Object.keys(categoryConfig).find(category =>
    categoryConfig[category].items.some(item => item[0] === key)
  ) || "load";
}

function renderCategory(category, selectedKey) {
  const config = categoryConfig[category];
  document.querySelectorAll("#categoryTabs [data-category]").forEach(button => {
    button.classList.toggle("active", button.dataset.category === category);
  });
  document.getElementById("subnavLabel").textContent = config.label + "｜選擇學習單元";
  document.getElementById("subtabs").innerHTML = config.items.map(([key,label]) =>
    `<button class="subtab ${key === selectedKey ? "active" : ""}" data-key="${key}">${label}</button>`
  ).join("");
}

document.getElementById("categoryTabs").addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;
  const category = button.dataset.category;
  const firstKey = categoryConfig[category].items[0][0];
  renderCategory(category, firstKey);
  render(firstKey);
});

document.getElementById("subtabs").addEventListener("click", event => {
  const button = event.target.closest("button[data-key]");
  if (button) render(button.dataset.key);
});

const originalRender = render;
render = function(key) {
  const category = categoryFor(key);
  renderCategory(category, key);
  originalRender(key);
};

render("tss");
</script>

</body>
</html>
