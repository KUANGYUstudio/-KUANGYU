<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光聿鐵人服 預購</title>
    <style>
        :root {
            /* 採用光聿藍與莫蘭迪色系的整合 */
            --main-color: #164082;
            --main-dark: #102e5e;
            --main-light: #eef2f5;
            --border-color: #d1d9e0;
            --bg-color: #f8f9fa;
            --error-color: #d6556d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
            letter-spacing: 0.04em;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            body { padding: 20px 10px; }
        }
        .header-logo {
            display: block;
            margin: 0 auto 15px;
            width: 60px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: var(--main-dark);
            margin: 0 0 30px 0;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--main-light);
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--main-dark);
            margin: 40px 0 20px;
            padding: 12px 16px;
            background-color: var(--main-light);
            border-left: 4px solid var(--main-color);
            border-radius: 4px;
            letter-spacing: 0.08em;
        }
        /* Product Images Section */
        .image-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .image-card-title {
            font-weight: 600;
            color: var(--main-dark);
            margin-bottom: 10px;
            font-size: 15px;
        }
        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        .product-desc {
            font-size: 15px;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.8;
        }
        /* Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 30px;
        }
        .size-table {
            width: 100%;
            min-width: 400px;
            border-collapse: collapse;
            font-size: 14px;
        }
        .size-table th {
            background-color: var(--main-light);
            color: var(--main-dark);
            font-weight: 600;
            padding: 14px 16px;
            text-align: left;
            white-space: nowrap;
        }
        .size-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: #444;
        }
        .size-table tr:last-child td {
            border-bottom: none;
        }
        /* Form elements */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
        }
        label.field-label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
        }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            color: #333;
            font-family: inherit;
            transition: all 0.2s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--main-color);
            box-shadow: 0 0 0 3px rgba(22, 64, 130, 0.15);
        }
        textarea { resize: vertical; min-height: 100px; }
        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #333;
        }
        input[type="radio"] {
            accent-color: var(--main-color);
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }
        .dynamic-panel {
            display: none;
            padding: 20px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: var(--main-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.2s ease;
        }
        button[type="submit"]:hover { background: var(--main-dark); }
        .required-star { color: var(--error-color); margin-left: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://kuangyu.studio/KUANGYU_logo_icon.png" alt="KUANGYU Logo" class="header-logo">
            <h1>光聿鐵人服 預購</h1>
        </header>

        <form id="preorderForm">
            <div class="section-title">01 / 產品資訊與尺寸</div>
            
            <div class="product-desc">
                光聿專屬訂製鐵人服，採用高彈力透氣排汗布料，提供極佳的肌肉支撐與舒適度。針對長距離賽事設計，背部與腿部配有補給口袋，方便拿取補給品。
            </div>

            <!-- 請將 src 替換為實際的圖片連結 -->
            <div class="image-card">
                <div class="image-card-title">商品款式外觀</div>
                <img src="https://via.placeholder.com/800x600/eef2f5/164082?text=Suit+Image" alt="鐵人服商品圖">
            </div>

            <div class="image-card">
                <div class="image-card-title">口袋細節說明</div>
                <img src="https://via.placeholder.com/800x400/eef2f5/164082?text=Pocket+Details" alt="口袋說明圖">
            </div>

            <div class="table-responsive">
                <table class="size-table">
                    <thead>
                        <tr>
                            <th>尺寸</th>
                            <th>胸圍 (cm)</th>
                            <th>腰圍 (cm)</th>
                            <th>臀圍 (cm)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 尺寸數據為範例，請依實際尺寸表進行修改 -->
                        <tr>
                            <td><strong>XS</strong></td>
                            <td>80 - 84</td>
                            <td>64 - 68</td>
                            <td>84 - 88</td>
                        </tr>
                        <tr>
                            <td><strong>S</strong></td>
                            <td>84 - 88</td>
                            <td>68 - 72</td>
                            <td>88 - 92</td>
                        </tr>
                        <tr>
                            <td><strong>M</strong></td>
                            <td>88 - 92</td>
                            <td>72 - 76</td>
                            <td>92 - 96</td>
                        </tr>
                        <tr>
                            <td><strong>L</strong></td>
                            <td>92 - 96</td>
                            <td>76 - 80</td>
                            <td>96 - 100</td>
                        </tr>
                        <tr>
                            <td><strong>XL</strong></td>
                            <td>96 - 100</td>
                            <td>80 - 84</td>
                            <td>100 - 104</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="section-title">02 / 訂購人資料</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">姓名<span class="required-star">*</span></label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label class="field-label">性別<span class="required-star">*</span></label>
                    <div class="option-group">
                        <label class="option-label"><input type="radio" name="gender" value="男" required><span>男</span></label>
                        <label class="option-label"><input type="radio" name="gender" value="女"><span>女</span></label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Email 信箱<span class="required-star">*</span></label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label class="field-label">聯絡電話<span class="required-star">*</span></label>
                    <input type="tel" name="phone" required>
                </div>
            </div>

            <div class="section-title">03 / 客製化選項</div>

            <div class="form-group">
                <label class="field-label">尺寸選擇<span class="required-star">*</span></label>
                <select name="size" required>
                    <option value="" disabled selected>請選擇尺寸</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>

            <div class="form-group">
                <label class="field-label">是否加印名字<span class="required-star">*</span></label>
                <div class="option-group">
                    <label class="option-label"><input type="radio" name="printNameOption" value="否" required><span>否，不需要</span></label>
                    <label class="option-label"><input type="radio" name="printNameOption" value="是"><span>是，我要加印名字</span></label>
                </div>
            </div>

            <div class="dynamic-panel" id="printNamePanel">
                <label class="field-label">加印的名稱<span class="required-star">*</span></label>
                <input type="text" name="printName" id="printNameInput" placeholder="請輸入欲加印的名稱">
            </div>

            <div class="form-group">
                <label class="field-label">腿圍調整<span class="required-star">*</span></label>
                <div class="option-group">
                    <label class="option-label"><input type="radio" name="thighOption" value="原尺寸" required><span>維持原尺寸</span></label>
                    <label class="option-label"><input type="radio" name="thighOption" value="放寬 1cm"><span>放寬 1cm</span></label>
                    <label class="option-label"><input type="radio" name="thighOption" value="放寬 2cm"><span>放寬 2cm</span></label>
                </div>
            </div>

            <div class="section-title">04 / 其他</div>

            <div class="form-group">
                <label class="field-label">備註 / 其他交辦事項</label>
                <textarea name="remarks" placeholder="如果有其他特殊需求或疑問，請在此填寫..."></textarea>
            </div>

            <button type="submit">確認送出預購</button>
        </form>
    </div>

    <script>
        // 處理動態顯示「加印的名稱」欄位
        const printNameRadios = document.querySelectorAll('input[name="printNameOption"]');
        const printNamePanel = document.getElementById('printNamePanel');
        const printNameInput = document.getElementById('printNameInput');

        printNameRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === '是') {
                    printNamePanel.style.display = 'block';
                    printNameInput.required = true;
                } else {
                    printNamePanel.style.display = 'none';
                    printNameInput.required = false;
                    printNameInput.value = '';
                }
            });
        });

        // 處理表單送出事件
        document.getElementById('preorderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // 此處後續可接上 GAS 的 fetch 傳送程式碼
            alert('表單已成功送出！');
        });
    </script>
</body>
</html>
